name: pruebas

on: [push, pull_request]

permissions:
  contents: read

# Las acciones van fijadas por su SHA completo, con la etiqueta que tenían al fijarlas:
# una etiqueta se puede mover, un SHA no.

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust   # contenedor desechable del job, sin contraseña
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      VF_PRUEBAS_SERVICIO: '1'
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PG_BIN: /usr/lib/postgresql/${{ matrix.pg }}/bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - name: cliente psql, pg_dump y pg_restore de la misma versión
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-${{ matrix.pg }}
      - name: pruebas
        run: node test/run.mjs
      - name: sabotajes
        if: matrix.pg == 17
        run: node test/run.mjs --sabotajes

  js:
    name: helper JS · Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: node test/js-solo.mjs

  deno:
    name: helper JS · Deno
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: deno run --allow-read test/js-solo.mjs
